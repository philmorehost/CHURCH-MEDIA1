name: Build Android apps

# Builds BOTH church apps whenever code is pushed to main:
#
#   RCCGLP63   the RCCGLP63YAYA app — RCCG LP63 YAYA   (com.churchmedia.app)
#   LIVINGWORD the Living Word Gospel Mission app      (com.livingwordgospelmission.app)
#
# Downloads live under: Actions -> this run -> Artifacts
#   rccglp63-apk   / rccglp63-aab
#   livingword-apk / livingword-aab
#
# Each app is an independent Flutter project in its own folder, so they are built
# by two independent jobs and one failing never blocks the other.
#
# Signing: every app has its OWN keystore secrets. When a set is missing the build
# still succeeds using the debug key — good enough to sideload and test, but Play
# rejects it. Signing keys are per-app in Play, so they are never shared.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rccglp63:
    name: RCCGLP63YAYA
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rccglp63-${{ runner.os }}-${{ hashFiles('RCCGLP63/android/**/*.gradle*', 'RCCGLP63/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-rccglp63-${{ runner.os }}-

      - name: Install dependencies
        working-directory: RCCGLP63
        run: flutter pub get

      - name: Set up release signing
        working-directory: RCCGLP63
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.keystore
            printf 'storeFile=../keystore/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Release signing configured."
            # Report the fingerprint now, so a wrong keystore is visible in seconds
            # instead of after a multi-minute Flutter build.
            if command -v keytool >/dev/null 2>&1; then
              echo -n "Configured keystore fingerprint: "
              keytool -list -v -keystore android/keystore/release.keystore \
                -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
                | tr -d '\r\n' | grep -o 'SHA1: [0-9A-F:]*' || echo "<could not read keystore>"
            fi
          else
            echo "::warning::No keystore secret set - the release build will fall back to the debug key and the AAB will be rejected by Google Play."
          fi

      - name: Build release APK
        working-directory: RCCGLP63
        run: |
          flutter build apk --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Build release AAB
        working-directory: RCCGLP63
        run: |
          flutter build appbundle --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Verify APK signature
        working-directory: RCCGLP63
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          else
            echo "apksigner not found; skipping verification"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rccglp63-apk
          path: RCCGLP63/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # An AAB exists only to be uploaded to Google Play, and Play accepts it only
      # when it is signed with the upload key already registered for this app.
      # When the keystore secret above is unset or holds a different file, Gradle
      # silently falls back to the debug key and the bundle is rejected at upload
      # time with "Your App Bundle is signed with the wrong key". The debug key is
      # generated fresh on every run, so its fingerprint differs run to run - that
      # is how you can tell it apart from a real keystore.
      #
      # This runs AFTER the APK upload on purpose: a debug-signed APK is still
      # useful for sideloading, so only the AAB artifact is withheld.
      # A missing or wrong upload key is a configuration gap on our side, not a
      # broken commit, so this reports a warning and withholds the AAB instead of
      # failing the run: a green run with usable artifacts beats a red one nobody
      # reads. The step output gates the upload below, so a mis-signed bundle still
      # cannot reach Google Play, and the job summary says plainly that no
      # publishable AAB was produced.
      # The fingerprint below is public information (Play Console shows it);
      # update it only if the app's upload key is ever reset.
      - name: Verify AAB is signed with the Play upload key
        id: aab_signer
        working-directory: RCCGLP63
        env:
          EXPECTED_UPLOAD_SHA1: "11:4A:B8:41:2E:9C:60:58:4E:1A:53:64:24:00:FE:C4:DE:4D:C8:6B"
        run: |
          if ! command -v keytool >/dev/null 2>&1; then
            echo "::warning::keytool not found; publishing the AAB unverified"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AAB=build/app/outputs/bundle/release/app-release.aab
          # keytool wraps long fingerprints across lines, so join them first.
          ACTUAL=$(keytool -printcert -jarfile "$AAB" \
            | tr -d '\r\n' \
            | grep -o 'SHA1: [0-9A-F:]*' \
            | head -1 \
            | sed 's/^SHA1: //')
          echo "AAB signer SHA1: ${ACTUAL:-<not readable>}"
          if [ "$ACTUAL" = "$EXPECTED_UPLOAD_SHA1" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Signer matches the Play upload key - safe to send to Google Play."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No publishable AAB this run"
              echo ""
              echo "The bundle is not signed with the RCCGLP63YAYA Play upload key, so the"
              echo "rccglp63-aab artifact was withheld - Google Play would reject it."
              echo ""
              echo "Expected SHA1: $EXPECTED_UPLOAD_SHA1"
              echo ""
              echo "Actual SHA1: ${ACTUAL:-not readable}"
              echo ""
              echo "The APK artifact is unaffected and is fine for sideload testing."
              echo ""
              echo "To fix: set the ANDROID_KEYSTORE_BASE64 repository secret to the base64 of"
              echo "rccglp63yaya-release.keystore, with KEY_ALIAS=philmore-rccglp63yaya and the"
              echo "matching store and key passwords, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::app-release.aab is not signed with the RCCGLP63YAYA Play upload key (expected $EXPECTED_UPLOAD_SHA1, got ${ACTUAL:-<not readable>}). The AAB artifact was withheld; the APK is still published. Set ANDROID_KEYSTORE_BASE64 plus KEY_ALIAS=philmore-rccglp63yaya and the passwords to publish."
          fi

      - name: Upload AAB
        if: steps.aab_signer.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rccglp63-aab
          path: RCCGLP63/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  livingword:
    name: LIVINGWORD (Living Word Gospel Mission)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-livingword-${{ runner.os }}-${{ hashFiles('LIVINGWORD/android/**/*.gradle*', 'LIVINGWORD/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-livingword-${{ runner.os }}-

      - name: Install dependencies
        working-directory: LIVINGWORD
        run: flutter pub get

      # google-services.json is committed for this app, so this step only exists to
      # fail with a useful message if someone ever removes it. Without the file the
      # Google Services Gradle plugin stops the build with a much vaguer error.
      - name: Confirm Firebase config is present
        working-directory: LIVINGWORD
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::LIVINGWORD/android/app/google-services.json is missing. Firebase Cloud Messaging cannot be set up without it. Re-download it from the Firebase console for project living-word-eeb04 (Project settings -> Your apps -> Android) and commit it."
            exit 1
          fi
          echo "Firebase config present."

      - name: Set up release signing
        working-directory: LIVINGWORD
        env:
          KEYSTORE_BASE64: ${{ secrets.LIVINGWORD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIVINGWORD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIVINGWORD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIVINGWORD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.keystore
            printf 'storeFile=../keystore/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Release signing configured."
          else
            echo "No keystore secret set - release build will fall back to the debug key."
          fi

      - name: Build release APK
        working-directory: LIVINGWORD
        run: |
          flutter build apk --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Build release AAB
        working-directory: LIVINGWORD
        run: |
          flutter build appbundle --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Verify APK signature
        working-directory: LIVINGWORD
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          else
            echo "apksigner not found; skipping verification"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: livingword-apk
          path: LIVINGWORD/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: livingword-aab
          path: LIVINGWORD/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Publishing to Google Play is manual: download livingword-aab from this run
      # and upload it in Play Console -> App -> Production (or another track).
      # No Play service-account key is needed in CI.
